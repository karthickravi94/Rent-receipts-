name: Build Debug APK

on:
  workflow_dispatch:   # run manually only

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Create placeholder google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rent-receipt-placeholder",
              "storage_bucket": "rent-receipt-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.example.rent_receipt_manager"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyPlaceholderKeyForBuildOnly"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: rent-receipt-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
