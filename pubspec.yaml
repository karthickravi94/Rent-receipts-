name: rent_receipt_manager
description: A professional rent receipt management app for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.9

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.13.1

  # File sharing
  share_plus: ^7.2.2
  path_provider: ^2.1.3
  open_file: ^3.3.2

  # Utilities
  intl: ^0.18.1
  uuid: ^4.4.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3

  # State management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/
